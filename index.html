    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <title>Nexty - Criação de Sites, Aplicativos Mobile e Automação</title>

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Nexty",
      "url": "https://nexty.com.br",
      "description": "Criação de sites, aplicativos mobile e automação de processos.",
      "foundingDate": "2025",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "availableLanguage": ["Portuguese", "English", "Spanish"]
      },
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Nexty",
      "url": "https://nexty.com.br",
      "description": "Criação de sites, aplicativos mobile e automação de processos.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://nexty.com.br/busca?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
